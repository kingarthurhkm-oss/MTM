.formation-info{font-size:11px;line-height:1.8;border-top:1px solid #334c58;margin-top:12px;padding-top:10px;color:#b6ccd4}
.formation-info p{margin:7px 0;overflow-wrap:anywhere}
.formation-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0}
.formation-stats div{background:#10212a;border:1px solid #334c58;border-radius:4px;text-align:center;padding:6px 2px}
.formation-stats dt{font-size:10px;color:#93afb9}.formation-stats dd{margin:2px 0 0;font:18px ui-monospace,monospace;color:#c4e9f4}
.formation-link{display:block;width:100%;text-align:left;font-size:11px;margin:7px 0;overflow-wrap:anywhere}
.formation-tree{padding:8px 0 8px 9px;border-left:1px solid #426373;margin:9px 0;font-size:11px;line-height:1.8}
.formation-tree summary{cursor:pointer;padding:6px 2px;color:#dfbf88}.formation-tree ul{padding-left:18px}

.sector-panel{margin-top:18px;border-top:1px solid #46606b;padding-top:12px}.sector-row{display:flex;align-items:center;gap:5px;margin:8px 0;flex-wrap:wrap}.sector-row meter{width:65px;accent-color:#77e4c7}.sector-row span{font-size:11px}.sector-row button{padding:6px;font-size:11px}

/* Map-first command surface. Existing information panels are on-demand drawers. */
[hidden]{display:none!important}
main{display:block;position:relative}
#map-section{height:100%;--dock-height:0px}
#map-section.has-unit{--dock-height:98px}
#sidebar{position:absolute;z-index:8;right:10px;top:10px;bottom:10px;width:min(380px,calc(100% - 20px));border:1px solid #49616b;border-radius:8px;box-shadow:0 12px 40px #0007;background:#101f26f5}
#panel-close{align-self:flex-end;background:none;border:0;color:var(--blue);min-height:44px}
.command-launcher{position:absolute;bottom:4px;left:12px;display:flex;gap:2px;background:#0b1b23ed;border:1px solid var(--line);border-radius:5px}
.command-launcher button{min-width:44px;min-height:44px;border:0;background:none;font-size:10px;padding:6px 12px}
.command-launcher button.active{color:var(--gold)}
#unit-controls{position:absolute;bottom:54px;left:12px;right:12px;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:4px;pointer-events:none}
#unit-controls>*{pointer-events:auto}
.unit-status-bar{display:flex;align-items:center;max-width:100%;min-height:48px;background:#0b1b23f2;border:1px solid #4e7883;border-radius:6px;box-shadow:0 4px 16px #0004}
.unit-identity{border:0;background:none;display:flex;align-items:center;gap:8px;padding:4px 10px;min-height:44px;min-width:0;text-align:left;font-size:11px}
.unit-identity img{width:32px;height:34px;object-fit:contain}
.unit-identity span{max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-identity small{margin-left:5px;color:var(--gold);font:9px ui-monospace}
.unit-stats{display:flex;align-items:center;gap:13px;padding:4px 10px;border-left:1px solid var(--line);white-space:nowrap;overflow-x:auto;scrollbar-width:thin}
.unit-stat{display:flex;align-items:center;gap:4px;color:var(--blue);min-height:30px}
.unit-stat b{color:var(--text);font:11px ui-monospace,monospace}
.unit-stat svg,.unit-actions svg,.detail-toggle svg,.boundary-editor svg{width:16px;height:16px;flex-shrink:0}
.detail-toggle{min-width:44px;min-height:44px;padding:8px;border:0;background:none;margin-left:auto;flex-shrink:0;color:var(--gold)}
.detail-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.unit-actions{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:thin}
.unit-actions button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:6px 10px;font-size:10px;background:#10232de8;white-space:nowrap}
.unit-actions .boundary-button{border-color:#987641;color:var(--gold)}
#interaction-card{position:absolute;z-index:5;left:12px;bottom:calc(58px + var(--dock-height));width:min(345px,calc(100% - 24px));max-height:calc(100% - 160px);overflow:auto;scrollbar-width:thin}
.boundary-editor,.attack-preview{margin:0;border:1px solid #a6834e;border-radius:6px;background:#13252df5;padding:12px;box-shadow:0 6px 20px #0005}
.boundary-editor strong{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:12px}
.boundary-editor strong span{margin-left:auto;font:11px ui-monospace}

.attack-preview{border-color:#bc7178;background:#241f26f5}

// Responsibility belongs to a command, never to a newly spawned map counter.
// Shares are fractions of the command's current hp. Combat removes local power
// first, then committed reserve, and updates shares without harming other tiles.
function sectorStrength(unit, tile, reserveLimit=10) {
  const sector=unit.sector;
  const total=unit.hp;
  if(!sector)return {total,local:total,reserve:0,committed:total,engaged:0};
  const local=total*(sector.allocations.find(a=>a.tile===tile)?.share??0);
  const reserve=total*sector.reserveShare;
  return {total,local,reserve,committed:local+Math.min(reserve,reserveLimit,Math.max(0,30-local)),engaged:sector.engaged??0};
}
function sectorOwner(units, tile, side) {
  return units.find(u=>u.side===side&&u.hp>0&&!u.embarked&&u.sector?.allocations.some(a=>a.tile===tile))??null;
}
function applySectorLoss(unit,tile,loss) {
  if(!unit.sector){unit.hp=Math.max(0,unit.hp-loss);return;}
  const sector=unit.sector,before=unit.hp;
  const commitment=sectorStrength(unit,tile).committed;
  const rows=sector.allocations.map(a=>({tile:a.tile,power:a.share*before}));
  const local=rows.find(a=>a.tile===tile);
  const localLoss=Math.min(local?.power??0,loss);
  if(local)local.power-=localLoss;
  const reserve=Math.max(0,sector.reserveShare*before-(loss-localLoss));
  unit.hp=Math.max(0,before-loss);
  sector.reserveShare=unit.hp?reserve/unit.hp:1;
  // An exhausted defense releases responsibility so the front can be breached.
  sector.allocations=rows.filter(a=>!(a.tile===tile&&loss>=commitment)).map(a=>({tile:a.tile,share:unit.hp?a.power/unit.hp:0}));
  if(!unit.hp)sector.allocations=[];
}
function validateSector(sector, board) {

  const valid=x=>Number.isFinite(x)&&x>=0&&x<=1;
  const ids=new Set();let sum=sector.reserveShare;
  if(!valid(sum)||sector.engaged!==0)throw Error('전투지경선 예비 전력이 올바르지 않습니다.');
  for(const a of sector.allocations){

  constructor(){this.a=[];}
  push(id,cost){const a=this.a;let i=a.length;a.push([id,cost]);while(i){const p=(i-1)>>1;if(a[p][1]<=cost)break;a[i]=a[p];i=p;}a[i]=[id,cost];}
  pop(){const a=this.a, out=a[0], end=a.pop();if(a.length){let i=0;while(true){let j=i*2+1;if(j>=a.length)break;if(j+1<a.length&&a[j+1][1]<a[j][1])j++;if(a[j][1]>=end[1])break;a[i]=a[j];i=j;}a[i]=end;}return out;}

class Game {

  aiTurn(){

    for(const u of red.filter(x=>x.type==='airdefense')){

    // 2. Air units: strike high-value or vulnerable targets within range
    for(const u of red.filter(x=>x.type==='air')){
      if(u.ap<1||u.acted)continue;
      const targets=blue.filter(v=>this.canAttack(u,v));
      if(targets.length){
        targets.sort((a,b)=>{
          const scoreA=(this.state.objectives.some(o=>o.tile===a.tile)?500:0)+(a.hp<=25?200:0)+(a.type==='artillery'?150:0)-a.hp;
          const scoreB=(this.state.objectives.some(o=>o.tile===b.tile)?500:0)+(b.hp<=25?200:0)+(b.type==='artillery'?150:0)-b.hp;

    }

    // 3. Strategic Objective assignment for ground forces
    const groundRed=red.filter(u=>['army','armor'].includes(u.type));
    const garrisons=new Map();
    const assignedUnits=new Set();

    const sortedObjectives=[...this.state.objectives].sort((a,b)=>{
      const aThreat=(a.held>0?100:0)+blue.filter(v=>this.board.distance(v.tile,a.tile)<=8).length*10;
      const bThreat=(b.held>0?100:0)+blue.filter(v=>this.board.distance(v.tile,b.tile)<=8).length*10;

    });

    for(const obj of sortedObjectives){

        .sort((a,b)=>this.board.distance(a.tile,obj.tile)-this.board.distance(b.tile,obj.tile));
      if(candidates.length){
        const chosen=candidates[0];
        if(this.board.distance(chosen.tile,obj.tile)<=18||obj.held>0||blue.some(v=>this.board.distance(v.tile,obj.tile)<=6)){

        if(sectorTarget!==undefined){this.attackTile(u.id,sectorTarget,true);continue;}
        const local=u.sector.allocations.find(a=>this.canAttackTile(u,a.tile));
        if(local){this.attackTile(u.id,local.tile,true);continue;}
        continue;
      }

  endTurn(){

    if(s.civilians<40||this.integrity()<30||ground.length===0||s.turn>45){
      s.result={won:false,title:s.turn>45?'시나리오 시간 종료':'작전 지속 불가',detail:s.civilians<40?'민간 보호 지수가 임계치 아래입니다.':this.integrity()<30?'국가 기반시설이 작전 유지 한계에 도달했습니다.':ground.length===0?'지상 전력이 모두 전투에서 이탈했습니다.':'45턴 이내에 목표를 달성하지 못했습니다.',score:this.score()};

    }return s.result;
  }
  score(){const s=this.state;return Math.max(0,Math.round(s.civilians*35+this.integrity()*30+s.cohesion*10+Math.max(0,46-s.turn)*35-s.losses.blue*.2));}

  import(text){
    if(typeof text!=='string'||text.length>2_000_000)throw Error('저장 파일 크기가 올바르지 않습니다.');

    if(s.version!==VERSION||s.mapId!==this.board.geography.id)throw Error('이전 동아시아 지도 저장은 호환되지 않습니다. 한반도 새 게임을 시작하세요.');
    const scenario=s.scenario??'legacy';
    if(!['legacy',ARMY_SCENARIO].includes(scenario)||(scenario===ARMY_SCENARIO&&s.datasetVersion!==ARMY_DATA.dataset_version))throw Error('지원하지 않는 편제 데이터 버전입니다.');
    if(s.version!==VERSION||!Number.isInteger(s.turn)||s.turn<1||s.turn>46||s.phase!=='player'||!Array.isArray(s.control)||s.control.length!==this.board.tiles.length)throw Error('지원하지 않는 저장 파일입니다.');
    for(let i=0;i<s.control.length;i++){
      const home=this.board.tiles[i].home,value=s.control[i];
      if(home===0?value!==0:home===3?value!==3:![1,2].includes(value))throw Error('지도 통제 데이터가 손상되었습니다.');
    }
    const validNum=(x,lo,hi)=>typeof x==='number'&&Number.isFinite(x)&&x>=lo&&x<=hi;
    for(const k of ['civilians','cohesion','escalation'])if(!validNum(s[k],0,100))throw Error('지표 데이터가 손상되었습니다.');
    for(const k of ['cp','materials','reserve'])if(!validNum(s[k],0,1000))throw Error('자원 데이터가 손상되었습니다.');
    if(!Number.isInteger(s.rng)||s.rng<0||s.rng>0xffffffff||!Number.isInteger(s.seed))throw Error('난수 상태가 올바르지 않습니다.');
    if(!['careful','balanced','push'].includes(s.posture)||!Array.isArray(s.policyUsed)||s.policyUsed.some(x=>!['shelter','diplomacy','cyber','supply'].includes(x)))throw Error('명령 상태가 올바르지 않습니다.');
    if(!['맑음','강우','안개','폭풍'].includes(s.weather))throw Error('기상 데이터가 올바르지 않습니다.');
    if(!s.losses||!validNum(s.losses.blue,0,1e7)||!validNum(s.losses.red,0,1e7))throw Error('전력 데이터가 올바르지 않습니다.');
    for(const k of ['airCover','recon','navalCover','cyberShield'])if(!validNum(s[k],0,10))throw Error('지원 상태가 올바르지 않습니다.');
    // Compare with an immutable scenario template, not the currently running scenario.
    const template=new Game(s.seed,scenario,new Board(this.board.geography)).state;
    if(!Array.isArray(s.units)||s.units.length!==template.units.length||!Array.isArray(s.sites)||s.sites.length!==template.sites.length||!Array.isArray(s.objectives)||s.objectives.length!==3)throw Error('시나리오 구성이 올바르지 않습니다.');
    const unitIds=new Set();
    for(const u of s.units){
      const original=template.units.find(v=>v.id===u.id);
      if(!original||unitIds.has(u.id)||u.type!==original.type||u.side!==original.side||typeof u.name!=='string'||u.name.length>80)throw Error('부대 구성이 올바르지 않습니다.');unitIds.add(u.id);
      if(u.formationId!==original.formationId||(u.formationId&&u.name!==original.name)||['mobility','firepower','armor','reconnaissance','logistics','gameSpec','stat_profile'].some(k=>k in u))throw Error('편제 참조 데이터가 올바르지 않습니다.');
      const t=this.board.tiles[u.tile];if(!Number.isInteger(u.tile)||!t||t.foreign||(u.hp>0&&!u.embarked&&TYPES[u.type].domain!=='air'&&(TYPES[u.type].domain==='sea')!==t.sea&&!t.railBridge))throw Error('부대 위치가 올바르지 않습니다.');
      if(!validNum(u.hp,0,100)||!validNum(u.supply,0,100)||!validNum(u.ap,0,20)||!validNum(u.cargo,0,100)||![null,'patrol','recon','support'].includes(u.mission)||typeof u.acted!=='boolean'||typeof u.entrenched!=='boolean')throw Error('부대 상태가 올바르지 않습니다.');
    }
    for(const u of s.units){
      if(u.embarked){const carrier=s.units.find(x=>x.id===u.embarked);if(!carrier||carrier.passenger!==u.id||carrier.type!=='transport'||carrier.tile!==u.tile||carrier.side!==u.side)throw Error('수송 상태가 손상되었습니다.');}
      if(u.passenger){const p=s.units.find(x=>x.id===u.passenger);if(u.type!=='transport'||!p||p.embarked!==u.id)throw Error('승선 상태가 손상되었습니다.');}
    }
    const sectorClaims=new Set();
    for(const u of s.units)if(u.sector!==undefined&&u.sector!==null){
      validateSector(u.sector,this.board);
      if(!this.isDivision(u)||u.sector.commandId!==u.id||u.sector.commandLevel!=='division')throw Error('전투지경선 지휘부가 올바르지 않습니다.');
      for(const a of u.sector.allocations){const key=u.side+':'+a.tile;if(sectorClaims.has(key))throw Error('전투지경선이 중복되었습니다.');sectorClaims.add(key);}
    }
    const siteIds=new Set();
    for(const f of s.sites){const orig=template.sites.find(x=>x.id===f.id);if(!orig||siteIds.has(f.id)||f.tile!==orig.tile||f.home!==orig.home||f.kind!==orig.kind||typeof f.name!=='string'||f.name.length>80||!validNum(f.health,0,100)||!validNum(f.shelter,0,1))throw Error('시설 데이터가 손상되었습니다.');siteIds.add(f.id);}
    const objIds=new Set();for(const o of s.objectives){const orig=template.objectives.find(x=>x.id===o.id);if(!orig||objIds.has(o.id)||o.tile!==orig.tile||typeof o.name!=='string'||o.name.length>80||!Number.isInteger(o.held)||o.held<0||o.held>46)throw Error('목표 데이터가 손상되었습니다.');objIds.add(o.id);}
    if(!Array.isArray(s.log)||s.log.length>90||s.log.some(l=>!Number.isInteger(l.turn)||typeof l.text!=='string'||l.text.length>400||!['info','good','danger','combat'].includes(l.kind)))throw Error('기록 데이터가 손상되었습니다.');
    if(s.result!==null&&(!s.result||typeof s.result.won!=='boolean'||typeof s.result.title!=='string'||s.result.title.length>100||typeof s.result.detail!=='string'||s.result.detail.length>400||!validNum(s.result.score,0,100000)))throw Error('결과 데이터가 손상되었습니다.');
    s.lastReport=null;this.state=s;this.rebuildRoads();this.refreshSupply();return true;
  }
}

const armyRegionTiles=new Map();
for(const region of Object.values(ARMY_DATA.regions)){
 const id=game.board.id(region.hex.q,region.hex.r);
 armyRegionTiles.set(id,[...(armyRegionTiles.get(id)||[]),region.name]);

const off=document.createElement('canvas');off.width=Math.ceil(game.board.width);off.height=Math.ceil(game.board.height);const oc=off.getContext('2d');
const state=()=>game.state;
function toast(text){$('toast').textContent=text;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3500);}
function autosave(){try{localStorage.setItem('peninsula-autosave-korea-v1',game.export());return true;}catch{return false;}}
function save(){toast(autosave()?'현재 진행을 저장했습니다.':'저장 공간을 사용할 수 없습니다. 메뉴에서 파일로 내보내세요.');}
function execute(result){if(result.ok){reachable=selected?game.reachable(game.unit(selected)):new Map();autosave();render();}toast(result.message);dirty=true;}
function baseMap(){
 $('map-caption').textContent=`${game.board.cols} × ${game.board.rows} HEX · ${game.board.tiles.length.toLocaleString('en-US')} TILES`;
 oc.clearRect(0,0,off.width,off.height);
 drawTileMap(oc,game.board.tiles);
}
function drawTileMap(context,tiles){
 // Every visible landmass comes from the existing ownership tiles, not polygons.
 const colors=['#0e2633','#284c51','#4e3e42','#283139'];
 for(const t of tiles){context.fillStyle=colors[t.home];hex(context,t);context.fill();context.strokeStyle=colors[t.home];context.lineWidth=.3;context.stroke();}
 for(const t of tiles)drawTerrain(context,t,game.board.layout);
 context.beginPath();
 for(const coast of game.board.coastlines){const [a,b]=game.board.layout.edge(game.board.tiles[coast.tile],coast.direction);context.moveTo(a.x,a.y);context.lineTo(b.x,b.y);}
 context.strokeStyle='#78999e';context.lineWidth=context===oc?1:1.5/camera.zoom;context.stroke();
 // Draw precisely the same rail edges used by movement and supply.
 for(const t of tiles){
  if(t.roadEdges.length){context.strokeStyle=t.home===1?'#80968d65':'#ad938765';context.lineWidth=1;for(const d of t.roadEdges){const n=game.board.neighbor(t.id,d);context.beginPath();context.moveTo(t.x,t.y);context.lineTo(game.board.tiles[n].x,game.board.tiles[n].y);context.stroke();}}
  for(const d of t.railEdges){const n=game.board.tiles[game.board.neighbor(t.id,d)];context.strokeStyle='#ddb66e';context.lineWidth=1.8;context.beginPath();context.moveTo(t.x,t.y);context.lineTo(n.x,n.y);context.stroke();}
 }
}
function hex(c,t,k=1){game.board.layout.path(c,t,k);}
function world(x,y){return screenToWorld({x,y},camera,width,height);}
function screen(x,y){return worldToScreen({x,y},camera,width,height);}
function minimapLayout(){const scale=Math.min(mini.width/game.board.width,mini.height/game.board.height);return {scale,x:(mini.width-game.board.width*scale)/2,y:(mini.height-game.board.height*scale)/2};}
function fit(full=false){
 const a={x:0,y:0},b={x:game.board.width,y:game.board.height};
 camera.x=(a.x+b.x)/2;camera.y=(a.y+b.y)/2;camera.zoom=Math.min(width/(b.x-a.x),height/(b.y-a.y))*game.board.geography.camera.padding;dirty=true;
}
function centerTile(id){const t=game.board.tiles[id];camera.x=t.x;camera.y=t.y;camera.zoom=Math.max(camera.zoom,3);dirty=true;}
function zoom(f,px=width/2,py=height/2){const p=world(px,py);camera.zoom=clamp(camera.zoom*f,game.board.geography.camera.minZoom,game.board.geography.camera.maxZoom);camera.x=p.x-(px-width/2)/camera.zoom;camera.y=p.y-(py-height/2)/camera.zoom;dirty=true;}
function resize(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);ctx.setTransform(d,0,0,d,0,0);if(first&&width&&height){fit();first=false;}dirty=true;}
new ResizeObserver(resize).observe($('map-section'));
function textAt(label,x,y,color,size=11){ctx.font=`${size}px "Noto KR",system-ui,sans-serif`;ctx.textAlign='center';ctx.fillStyle='#07141ad9';ctx.lineWidth=3;ctx.strokeStyle='#0b202a';ctx.strokeText(label,x,y);ctx.fillStyle=color;ctx.fillText(label,x,y);}
let hitUnits=[];
function draw(){
 if(dirty&&width&&height){
  dirty=false;ctx.clearRect(0,0,width,height);ctx.fillStyle='#0b1e29';ctx.fillRect(0,0,width,height);
  ctx.save();ctx.translate(width/2,height/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);
  const tl=world(0,0),br=world(width,height),on=t=>t.x>=tl.x-30&&t.x<=br.x+30&&t.y>=tl.y-30&&t.y<=br.y+30;
  const tiles=game.board.tiles.filter(on);
  if(camera.zoom>1)drawTileMap(ctx,tiles);else ctx.drawImage(off,0,0);
  for(const t of tiles){
   if(t.foreign||t.sea)continue;
   if(state().control[t.id]!==t.home){ctx.fillStyle=state().control[t.id]===1?'#4d99b990':'#ac5d6080';hex(ctx,t);ctx.fill();}
   if(layer==='supply'&&state().control[t.id]===1){const q=1-(game.supplyCache.blue?.dist[t.id]??Infinity)/40;ctx.fillStyle=q>.6?'#56b7aa70':q>.2?'#d6ad5655':'#d3646977';hex(ctx,t);ctx.fill();}
  }
  if(camera.zoom>.8){ctx.strokeStyle='#7796a325';ctx.lineWidth=.5/camera.zoom;for(const t of tiles){hex(ctx,t);ctx.stroke();}}
  if(mode==='move'){for(const [id] of reachable){if(id===game.unit(selected)?.tile)continue;const t=game.board.tiles[id];ctx.fillStyle='#76c9e936';hex(ctx,t);ctx.fill();ctx.strokeStyle='#8bceda77';ctx.lineWidth=.6/camera.zoom;ctx.stroke();}}
  if(selected&&layer==='supply'){const path=game.supplyPath(game.unit(selected));ctx.strokeStyle='#97d8bd';ctx.lineWidth=2/camera.zoom;ctx.setLineDash([6/camera.zoom,4/camera.zoom]);ctx.beginPath();path.forEach((id,i)=>{const t=game.board.tiles[id];i?ctx.lineTo(t.x,t.y):ctx.moveTo(t.x,t.y);});ctx.stroke();ctx.setLineDash([]);}
  // Responsibility stays visible even when HQ is off-screen or deselected.
  for(const command of game.alive('blue').filter(u=>!u.embarked))for(const a of command.sector?.allocations??[]){const t=game.board.tiles[a.tile];if(!on(t))continue;const focused=command.id===selected;ctx.fillStyle=focused?'#efb66420':'#efb6640c';hex(ctx,t,.93);ctx.fill();ctx.strokeStyle=focused?'#efb664':'#b28c5066';ctx.lineWidth=(focused?1.8:1)/camera.zoom;ctx.stroke();}
  if(mode==='sector')for(const t of tiles){if(sectorCandidates.has(t.id)){hex(ctx,t,.82);ctx.strokeStyle='#d7a54a70';ctx.lineWidth=1/camera.zoom;ctx.setLineDash([2/camera.zoom,3/camera.zoom]);ctx.stroke();ctx.setLineDash([]);}if(sectorDraft.allocations.some(a=>a.tile===t.id)){hex(ctx,t,.7);ctx.fillStyle='#efb66435';ctx.fill();ctx.strokeStyle='#ffe0a0';ctx.lineWidth=2/camera.zoom;ctx.stroke();ctx.beginPath();ctx.moveTo(t.x-2,t.y);ctx.lineTo(t.x,t.y+2);ctx.lineTo(t.x+4,t.y-3);ctx.stroke();}}
  if(mode==='move'&&selected&&game.active(game.unit(selected)))for(const t of tiles){if(game.canAttackTile(game.unit(selected),t.id)){hex(ctx,t,.86);ctx.strokeStyle='#ee858d';ctx.lineWidth=2/camera.zoom;ctx.stroke();}}
  if(!selected&&selectedTile!==null){const t=game.board.tiles[selectedTile];ctx.strokeStyle='#edbb70';ctx.lineWidth=2/camera.zoom;hex(ctx,t,1.05);ctx.stroke();}
  ctx.restore();
  for(const label of GEOGRAPHY.labels){const t=game.board.tiles[game.board.id(label.col,label.row)],p=screen(t.x,t.y);if(p.x>0&&p.x<width&&p.y>70&&p.y<height)textAt(label.text,p.x,p.y,label.color,12);}

 else {html+=`<div class="section-label">MISSION BRIEF · 2026 / FICTIONAL</div><div class="empty-art"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 1v7m0 8v7M1 12h7m8 0h7"/></svg></div><h2 class="intro-title">진격과 보존 사이,<br>지휘관의 선택.</h2><p class="intro-copy">세 통제 구역을 확보하고 2턴 동안 유지하세요. 빠른 종료, 민간 보호, 기반시설 보존이 함께 점수에 반영됩니다.</p><div class="objective-list">${state().objectives.map(o=>`<div class="objective-row"><span>${esc(o.name)}</span><b>${Math.min(2,o.held)} / 2턴</b></div>`).join('')}</div><button class="wide primary" data-action="first-unit" style="width:100%">첫 지상부대 선택 →</button><div class="divider"></div>`;}
 html+=`<div class="section-label">전투 태세</div><div class="posture">${[['careful','피해 보존'],['balanced','균형'],['push','돌파']].map(([id,n])=>`<button data-posture="${id}" class="${state().posture===id?'active':''}">${n}</button>`).join('')}</div><p class="policy-note">${{careful:'공격력 ×0.82 · 전투에 따른 보호 지수 감소 최소화',balanced:'공격력 ×1.00 · 균형적인 전투 결과',push:'공격력 ×1.20 · 보호·시설 피해와 위기 상승 증가'}[state().posture]}</p><div class="divider"></div>${policies()}`;

 $('map-objectives').innerHTML=s.objectives.map(o=>`<button class="objective-chip" data-objective="${o.id}"><span>${esc(o.name)}</span><b>${Math.min(2,o.held)}/2</b></button>`).join('');

 }

 }

function briefing(){modal(`<p class="modal-eyebrow">PENINSULA / SCENARIO 01</p><h2>한반도, 2026.</h2><div class="briefing-stats"><div><strong>${game.board.tiles.length.toLocaleString('en-US')}</strong><span>헥스 타일</span></div><div><strong>3</strong><span>작전 영역</span></div><div><strong>45</strong><span>최대 턴</span></div></div><div class="modal-copy"><p>대한민국 진영에서 육·해·공 전력을 지휘하세요. 세 구역을 2턴 동안 확보하면서 민간 보호와 기반시설을 보존하는 것이 목표입니다.</p><p><b>부대 선택 → 이동·공격 → 국가 지휘 명령 → 턴 종료.</b> 지도는 한 손가락으로 이동하고 두 손가락으로 확대할 수 있습니다.</p><p>2026년을 배경으로 한 가상 전략 게임입니다. 기본값은 공개 육군 부대명과 시군 대표 권역을 사용하는 편제입니다. 지원전력·적군·시설·성능·피해 수치는 가상이며 실제 전쟁 예측값이 아닙니다. 턴은 실제 시간과 대응하지 않습니다.</p></div><div class="modal-grid"><button data-modal="help">조작법과 규칙</button><button class="primary wide" data-modal="start">공개 육군 편제로 시작 · 55개 부대 →</button><button data-modal="legacy-start">가상 편제로 시작 · 한반도 맵</button><button data-modal="army-catalog">육군 편제·출처 먼저 보기</button></div>`);}

function help(){modal(`<p class="modal-eyebrow">FIELD MANUAL</p><h2>지휘관 안내</h2><div class="modal-copy"><ol><li>지도 또는 <b>부대</b> 탭에서 아군을 선택합니다.</li><li>아군 선택 즉시 표시되는 <b>청록 헥스</b>를 터치하면 이동합니다. 빈 공간은 선택 해제, 같은 부대를 다시 누르거나 상태 바의 펼치기 버튼을 누르면 상세 정보가 열립니다.</li><li>붉은 ⌖의 적 또는 적 책임 타일을 터치하고 예상 피해를 확인한 뒤 <b>공격 실행</b>을 누릅니다. 취소하면 이동 상태로 돌아갑니다. 전투지경선은 독립 버튼으로 편집하고 확정해야 저장됩니다.</li><li>비행단은 방어·정찰·지원 또는 전투 출격 중 하나를 수행합니다. 방공여단은 주변 시설과 전력을 자동 방어합니다.</li><li>지상부대를 가동률 25% 이상인 아군 항만에 두고 인접 수송선단으로 승선시킵니다. 하선은 인접한 아군 해안에서 가능합니다.</li><li>보급 탭의 청록색은 원활, 황색은 감소, 적색은 단절입니다. 보급대·수송선단은 3헥스 이내 부대에 물자를 전달합니다.</li><li>시설 복구에는 지휘점 2와 자재 12가 필요합니다. 통신은 지휘점, 전력·철도·연료는 보급, 도로는 이동, 공항은 출격 효율에 영향을 줍니다.</li><li>세 목표를 2턴 유지하면 종료됩니다. 민간 보호 70%와 시설 60% 이상이면 보존 목표도 달성합니다. 보호 40% 미만, 시설 30% 미만, 지상전력 상실 또는 45턴 초과 시 실패합니다.</li></ol><p>점수는 보호·시설·전력 보존과 짧은 소요 턴을 합산합니다. 핵 위협은 위기 85 이상에서 발생하는 추상적 재난 이벤트이며, 실제 무기 효과를 계산하지 않습니다.</p><p>적 부대는 정찰 범위에 들어와야 표시됩니다. 외국 영토와 영공은 플레이할 수 없습니다. 모든 시설 위치와 전력 수치는 가상입니다.</p></div><div class="legend-symbols">${['army','armor','artillery','air','navy','airdefense','transport'].map(t=>`<div><img src="${symbolPath('blue',t)}" alt="${TYPES[t].name}"><span>${TYPES[t].name}</span></div>`).join('')}</div><p class="policy-note">APP-6 기호: 사단 XX · 여단 X. 비행단·전단은 공중·수상 기호와 부대명으로 집계 단위를 표시합니다. 전체 APP-6 표준을 구현한 군용 체계는 아닙니다.<br>해안선: Natural Earth / world-atlas 2.0.2 · 기호: milsymbol 3.0.3 (MIT). 작은 섬은 타일 해상도에 맞춰 확대 표시됩니다.</p><button data-modal="close" class="primary" style="width:100%;margin-top:18px">확인</button>`);}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.tab){if(['sector','attack-preview','unload'].includes(mode)){toast('현재 명령을 확정하거나 취소하세요.');return;}tab=d.tab;panelOpen=true;mode='detail';render();$('panel-content').scrollTop=0;}
 if(d.layer){layer=d.layer;render();}
 if(d.unit){choose(d.unit,true);$('panel-content').scrollTop=0;if($('modal').open)closeModal();}
 if(d.formation)formationDetail(d.formation);
 if(d.jumpFormation){const f=armyFormation(d.jumpFormation),u=state().units.find(u=>u.formationId===f?.id&&u.hp>0);if(u)choose(u.id,true);else if(f){selected=null;selectedSite=null;target=null;mode='select';selectedTile=armyTile(game.board,f);centerTile(selectedTile);render();}closeModal();}
 if(d.stack)modal(`<h2>같은 헥스의 부대</h2><p class="modal-copy">같은 대표 권역에 배치되거나 게임 중 함께 이동한 부대입니다.</p>${game.at(Number(d.stack)).filter(u=>u.side==='blue').map(u=>`<button class="formation-link" data-unit="${u.id}">${esc(u.name)}</button>`).join('')}<button data-modal="close">닫기</button>`);
 if(d.filter){filter=d.filter;render();}
 if(d.site){selectedSite=d.site;selected=null;target=null;tab='command';mode='detail';panelOpen=true;selectedTile=state().sites.find(s=>s.id===d.site).tile;centerTile(selectedTile);render();}
 if(d.objective){const obj=state().objectives.find(o=>o.id===d.objective);centerTile(obj.tile);}
 if(d.sectorCenter!==undefined)centerTile(Number(d.sectorCenter));
 if(d.sectorTile!==undefined&&selected){const u=game.unit(selected),tile=Number(d.sectorTile),a=u.sector.allocations.find(a=>a.tile===tile),delta=Number(d.sectorDelta);const amount=Math.max(-a.share,Math.min(u.sector.reserveShare,delta));execute(game.setSector(u.id,u.sector.allocations.map(a=>({...a,share:a.share+(a.tile===tile?amount:0)})),u.sector.reserveShare-amount));}
 if(d.mode){if(d.mode==='sector')editSector();else if(d.mode==='unload'){mode='unload';panelOpen=false;render();}else {resumeMove();render();}}
 if(d.posture&&!state().result){state().posture=d.posture;autosave();render();}
 if(d.policy)execute(game.policy(d.policy));
 if(d.mission&&selected)execute(game.airMission(selected,d.mission));
 if(d.action){
  if(d.action==='cancel'||d.action==='close-panel'){resumeMove();render();}
  if(d.action==='details'&&selected){if(mode==='detail'){resumeMove();}else if(mode==='move'){mode='detail';panelOpen=true;tab='command';}render();}
  if(d.action==='wait'){clearSelection();render();}
  if(d.action==='sector-confirm'&&selected&&mode==='sector'){const result=game.setSector(selected,sectorDraft.allocations,sectorDraft.reserveShare);if(result.ok)resumeMove();execute(result);}

  if(d.action==='first-unit'){const u=game.alive('blue').find(u=>['army','armor'].includes(u.type));if(u)choose(u.id,true);}
  if(d.action==='sector-overview'&&selected)fitSector(game.unit(selected));
  if(d.action==='center'&&selected)centerTile(game.unit(selected).tile);
  if(d.action==='fortify'&&selected)execute(game.fortify(selected));
  if(d.action==='repair'&&selectedSite)execute(game.repair(selectedSite));
  if(d.action==='load'&&selected)execute(game.load(selected));
  if(d.action==='deliver'&&selected)execute(game.deliver(selected));
  if(d.action==='attack'&&mode==='attack-preview'&&selected&&target){const result=game.attack(selected,target,false,targetTile);if(result.ok)resumeMove();execute(result);resultModal();}
 }
 if(d.modal){
  if(['close','start'].includes(d.modal)){closeModal();if(d.modal==='start')autosave();}
  if(d.modal==='help')help();
  if(d.modal==='army-catalog')armyCatalog();
  if(d.modal==='reset-army')startScenario(ARMY_SCENARIO);
  if(d.modal==='legacy-start')startScenario('legacy');
  if(d.modal==='save'){save();closeModal();}
  if(d.modal==='restore'){try{const text=localStorage.getItem('peninsula-autosave-korea-v1');if(text)importSave(text);else toast('저장된 진행이 없습니다.');}catch{toast('저장 공간에 접근하지 못했습니다.');}}
  if(d.modal==='export')exportSave();
  if(d.modal==='import'){if(window.AndroidFiles)window.AndroidFiles.importSave();else $('import-input').click();}
  if(d.modal==='new')modal('<p class="modal-eyebrow">NEW SCENARIO</p><h2>새로 시작할까요?</h2><p class="modal-copy">현재 자동 저장은 새 시나리오로 교체됩니다. 보관하려면 먼저 파일로 내보내세요.</p><div class="modal-grid"><button data-modal="close">취소</button><button data-modal="reset" class="primary wide">공개 육군 편제로 새로 시작 · 55개 부대</button><button data-modal="reset-legacy">가상 편제로 시작 · 한반도 맵</button></div>');
  if(d.modal==='reset')startScenario(ARMY_SCENARIO);
  if(d.modal==='reset-legacy')startScenario('legacy');
 }
});
$('zoom-in').onclick=()=>zoom(1.3);$('zoom-out').onclick=()=>zoom(1/1.3);$('center-button').onclick=()=>fit();$('theater-button').onclick=()=>fit(true);$('save-button').onclick=save;$('end-turn').onclick=endTurn;$('menu-button').onclick=menu;
$('import-input').onchange=async e=>{const file=e.target.files[0];if(file){if(file.size>2_000_000)toast('저장 파일은 2MB 이하만 지원합니다.');else importSave(await file.text());}e.target.value='';};
window.receiveNativeSave=importSave;window.saveBeforePause=autosave;window.handleAndroidBack=cancelInteraction;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').open){e.preventDefault();cancelInteraction();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave();});
window.addEventListener('beforeunload',autosave);
let resumed=false;try{const saved=localStorage.getItem('peninsula-autosave-korea-v1');if(saved){game.import(saved);resumed=true;}}catch{toast('이전 저장을 읽지 못했습니다. 새 시나리오로 시작합니다.');}
baseMap();render();resize();requestAnimationFrame(draw);if(!resumed)briefing();else toast(`${state().turn}턴 자동 저장을 이어갑니다.`);

document.fonts.ready.then(()=>{dirty=true;});

})();
</script>
</body>
</html>
