name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules
        run: npm test
      - name: Build standalone HTML
        run: python3 tools/build-standalone.py
      - name: Prepare Pages site
        run: |
          HTML_RELEASE=$(node -p "require('./package.json').htmlRelease")
          PAGE_HTML="dist/peninsula-2026-${HTML_RELEASE}.html"
          test -f "$PAGE_HTML"
          grep -q "class HexLayout" "$PAGE_HTML"
          mkdir -p _site
          cp "$PAGE_HTML" _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
