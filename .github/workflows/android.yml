name: Android game build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify game rules
        run: npm test
      - name: Create offline companion
        run: python3 tools/build-standalone.py
      - name: Build and lint Android package
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: peninsula-2026-android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/peninsula-2026-v*.html
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
