name: Android game build

on:
  push:
    branches:
      - codex/peninsula-development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify game rules
        run: npm test
      - name: Create offline companion
        run: python3 tools/build-standalone.py
      - name: Build and lint Android package
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: peninsula-2026-android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/peninsula-2026-v*.html
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30
      - name: Prepare GitHub Pages site
        run: |
          mkdir -p _site
          LATEST_HTML=$(find dist -maxdepth 1 -type f -name 'peninsula-2026-v*.html' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)
          test -n "$LATEST_HTML"
          cp "$LATEST_HTML" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/peninsula-development'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
